<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="memory to types to structures to operations to persistence">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1A1408"/><stop offset="50%" stop-color="#0D1018"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="trk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8942E"/><stop offset="55%" stop-color="#8A8FB0"/>
      <stop offset="100%" stop-color="#4A9EDB"/>
    </linearGradient>
    <radialGradient id="pg"><stop offset="0%" stop-color="#E8942E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8942E" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family:'JetBrains Mono','Consolas',monospace; }
      .lbl { font-size:11px; letter-spacing:3px; fill:#7A8196; }
      .tag { font-size:22px; font-weight:700; letter-spacing:5px; fill:#D6DAE4;
              font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .sig { font-size:10.5px; letter-spacing:3.4px; fill:#454B60; }
      .hd  { font-size:10px; fill:#2E3346; }
    </style>
  </defs>

  <rect width="1200" height="250" fill="url(#fbg)"/>

  <g>
    <text x="30" y="30" class="hd">0x7FFE0000  4A 3C 00 21 FF 08 12 D4  6B 2E 90 AA 03 17 CC 55</text>
    <text x="30" y="48" class="hd">0x7FFE0010  21 88 4F 0C 9A 33 E1 70  05 BD 42 19 8E 60 2B F7</text>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="108" text-anchor="middle" class="tag">EVERY ALLOCATION ACCOUNTED FOR
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5.5s" repeatCount="indefinite"/>
  </text>

  <line x1="150" y1="170" x2="1050" y2="170" stroke="url(#trk)" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="5 9" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <circle cy="170" r="24" fill="url(#pg)">
    <animate attributeName="cx" values="150;1050;150" dur="8s" repeatCount="indefinite"
             keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <circle cy="170" r="5" fill="#E8942E">
    <animate attributeName="cx" values="150;1050;150" dur="8s" repeatCount="indefinite"
             keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>

  <circle cx="150" cy="170" r="8" fill="#0B0D14" stroke="#E8942E" stroke-width="2">
    <animate attributeName="r" values="8;11.5;8" dur="3s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="204" text-anchor="middle" class="lbl">MEMORY</text>
  <circle cx="370" cy="170" r="8" fill="#0B0D14" stroke="#E8942E" stroke-width="2">
    <animate attributeName="r" values="8;11.5;8" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="370" y="204" text-anchor="middle" class="lbl">TYPES</text>
  <circle cx="600" cy="170" r="8" fill="#0B0D14" stroke="#4A9EDB" stroke-width="2">
    <animate attributeName="r" values="8;11.5;8" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="204" text-anchor="middle" class="lbl">STRUCTURES</text>
  <circle cx="840" cy="170" r="8" fill="#0B0D14" stroke="#4A9EDB" stroke-width="2">
    <animate attributeName="r" values="8;11.5;8" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite"/>
  </circle>
  <text x="840" y="204" text-anchor="middle" class="lbl">OPERATIONS</text>
  <circle cx="1050" cy="170" r="8" fill="#0B0D14" stroke="#4A9EDB" stroke-width="2">
    <animate attributeName="r" values="8;11.5;8" dur="3s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1050" y="204" text-anchor="middle" class="lbl">CSV</text>

  <text x="600" y="234" text-anchor="middle" class="sig">C D A T A F R A M E &#183; C O R E</text>
</svg>
